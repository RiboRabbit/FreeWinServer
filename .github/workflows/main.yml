name: CI

on:
  - push
  - workflow_dispatch

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Setup RDP
        run: |
          $u="runneradmin"
          $p="Str0ngP@ssw0rd!"

          net user $u $p /add
          net localgroup administrators $u /add

          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name TermService -StartupType Automatic
          Start-Service TermService

      - name: Verify RDP
        run: |
          netstat -an | findstr 3389
          Test-NetConnection -ComputerName localhost -Port 3389

      - name: Download ngrok
        run: |
          Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
          Expand-Archive ngrok.zip

      - name: Auth ngrok
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          .\ngrok\ngrok.exe config add-authtoken $env:NGROK_AUTH_TOKEN

      - name: Start Tunnel (Improved)
        run: |
          Start-Process .\ngrok\ngrok.exe -ArgumentList "tcp 3389 --region=ap --log=stdout"

      - name: Get Tunnel URL
        run: |
          Start-Sleep -Seconds 12
          $t = (Invoke-RestMethod http://127.0.0.1:4040/api/tunnels)
          $t.tunnels[0].public_url

      - name: Keep Alive
        run: |
          Start-Sleep -Seconds 21600
