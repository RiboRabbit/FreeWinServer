name: CI

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Download
      run: Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip

    - name: Extract
      run: Expand-Archive ngrok.zip

    - name: Auth
      run: .\ngrok\ngrok.exe config add-authtoken $Env:NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

        # Ensure service is running (YOU MISSED THIS)
        Set-Service -Name TermService -StartupType Automatic
        Start-Service TermService

    - name: Set Password
      run: |
        Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "Str0ngP@ssw0rd!" -Force)

    - name: Verify Port
      run: |
        netstat -an | findstr 3389
        Test-NetConnection -ComputerName localhost -Port 3389

    - name: Create Tunnel
      run: |
        Start-Process .\ngrok\ngrok.exe -ArgumentList "tcp 3389 --region=ap"

    - name: Get URL
      run: |
        Start-Sleep -Seconds 10
        (Invoke-RestMethod http://127.0.0.1:4040/api/tunnels).tunnels[0].public_url

    - name: Keep Alive
      run: Start-Sleep -Seconds 21600
